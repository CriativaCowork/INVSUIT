        color: '#7CB342',

        data: {
          value: 78,
          max: 100,
          label: 'Meta Atingida'
        }

    ];
    
    // ============== COLOR PALETTES ==============
    const ColorPalettes = [
      ['#66CFF5', '#43A047', '#FB8C00', '#E53935', '#8E24AA', '#00ACC1'],
      ['#5C6BC0', '#26A69A', '#FFCA28', '#EF5350', '#AB47BC', '#29B6F6'],
      ['#42A5F5', '#66BB6A', '#FFA726', '#EC407A', '#7E57C2', '#26C6DA'],
      ['#3949AB', '#2E7D32', '#F57C00', '#C62828', '#6A1B9A', '#00838F'],
      ['#33BEF2', '#388E3C', '#EF6C00', '#D32F2F', '#7B1FA2', '#0097A7'],
      ['#7986CB', '#81C784', '#FFD54F', '#E57373', '#BA68C8', '#4DD0E1']
    ];
    
    // ============== UTILITY FUNCTIONS ==============
    const Utils = {
      generateId: () => 'chart_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
      
      getRandomColor: () => {
        const palette = ColorPalettes[Math.floor(Math.random() * ColorPalettes.length)];
        return palette[Math.floor(Math.random() * palette.length)];
      },
      
      getColorPalette: (count) => {
        const allColors = ColorPalettes.flat();
        const colors = [];
        for (let i = 0; i < count; i++) {
          colors.push(allColors[i % allColors.length]);
        }
        return colors;
      },
      
      formatCurrency: (value, currency = 'AOA') => {
        const curr = AppState.currencies[currency] || AppState.currencies.AOA;
        return `${curr.symbol} ${Number(value).toLocaleString('pt-PT')}`;
      },
      
      convertCurrency: (value, from, to) => {
        const fromRate = AppState.currencies[from]?.rate || 1;
        const toRate = AppState.currencies[to]?.rate || 1;
        return (value / fromRate) * toRate;
      },
      
      deepClone: (obj) => JSON.parse(JSON.stringify(obj)),
      
      debounce: (func, wait) => {
        let timeout;
        return function executedFunction(...args) {
          const later = () => {
            clearTimeout(timeout);
            func(...args);
          };
          clearTimeout(timeout);
          timeout = setTimeout(later, wait);
        };
      },
      
      showToast: (message, type = 'success') => {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        const bgColor = type === 'success' ? 'bg-accent' : type === 'error' ? 'bg-danger' : 'bg-primary';
        toast.className = `${bgColor} text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-2 transform translate-x-full transition-transform duration-300`;
        toast.innerHTML = `
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            ${type === 'success' ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>' : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>'}
          </svg>
          <span>${message}</span>
        `;
        container.appendChild(toast);
        
        setTimeout(() => toast.classList.remove('translate-x-full'), 10);
        setTimeout(() => {
          toast.classList.add('translate-x-full');
          setTimeout(() => toast.remove(), 300);
        }, 3000);
      }
    };
    
    // ============== CHART RENDERER ==============
    const ChartRenderer = {
      create: (containerId, chartConfig, chartId) => {
        const canvas = document.getElementById(containerId);
        if (!canvas) return null;
        
        const ctx = canvas.getContext('2d');
        const type = ChartTypes[chartConfig.type] || ChartTypes.column;
        
        // Destroy existing chart
        if (AppState.chartInstances[chartId]) {
          AppState.chartInstances[chartId].destroy();
        }
        
        // Prepare datasets with colors
        const datasets = chartConfig.data.datasets.map((ds, idx) => {
          const colors = Utils.getColorPalette(chartConfig.data.labels?.length || ds.data?.length || 6);
          const isCircular = type.chartType === 'pie' || type.chartType === 'doughnut' || type.chartType === 'polarArea';
          const isLine = type.chartType === 'line' || type.chartType === 'radar';
          
          return {
            ...ds,
            backgroundColor: ds.backgroundColor || (isCircular ? colors : (isLine ? 'transparent' : colors[idx % colors.length])),
            borderColor: ds.borderColor || (isCircular ? 'rgba(255,255,255,0.8)' : colors[idx % colors.length]),
            borderWidth: ds.borderWidth || (isLine ? 2 : 1),
            pointBackgroundColor: colors[idx % colors.length],
            pointBorderColor: '#fff',
            pointBorderWidth: 2,
            fill: type.fill || false,
            tension: type.tension || 0,
            stepped: type.stepped || false
          };
        });
        
        // Chart configuration
        const config = {
          type: type.chartType,
          data: {
            labels: chartConfig.data.labels,
            datasets: datasets
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            indexAxis: type.indexAxis || 'x',
            plugins: {
              legend: {
                display: true,
                position: 'bottom',
                labels: {
                  padding: 15,
                  usePointStyle: true
                }
              },
              title: {
                display: !!chartConfig.title,
                text: chartConfig.title || '',
                font: { size: 16, weight: 'bold' },
                padding: { bottom: 20 }
              },
              datalabels: {
                display: (context) => {
                  return type.chartType === 'pie' || type.chartType === 'doughnut' || type.chartType === 'polarArea';
                },
                formatter: (value, context) => {
                  if (type.chartType === 'pie' || type.chartType === 'doughnut' || type.chartType === 'polarArea') {
                    const total = context.dataset.data.reduce((a, b) => a + b, 0);
                    const percentage = ((value / total) * 100).toFixed(1);
                    return `${value}\n(${percentage}%)`;
                  }
                  return value;
                },
                color: '#fff',
                font: { weight: 'bold', size: 11 },
                textAlign: 'center'
              }
            },
            scales: (type.chartType === 'pie' || type.chartType === 'doughnut' || type.chartType === 'radar' || type.chartType === 'polarArea') ? {} : {
              x: {
                stacked: type.stacked || false,
                grid: { display: false }
              },
              y: {
                stacked: type.stacked || false,
                beginAtZero: true,
                grid: { color: 'rgba(0,0,0,0.05)' }
              }
            }
          },
          plugins: [ChartDataLabels]
        };
        
        // Special handling for gauge
        if (chartConfig.type === 'gauge') {
          const gaugeValue = chartConfig.data.value || 0;
          const gaugeMax = chartConfig.data.max || 100;
          config.data = {
            datasets: [{
              data: [gaugeValue, gaugeMax - gaugeValue],
              backgroundColor: ['#66CFF5', '#E0E0E0'],
              borderWidth: 0
            }]
          };
          config.options.circumference = 180;
          config.options.rotation = -90;
          config.options.cutout = '70%';
          config.options.plugins.datalabels = {
            display: true,
            formatter: (value, context) => {
              if (context.dataIndex === 0) return `${gaugeValue}%`;
              return '';
            },
            color: '#66CFF5',
            font: { weight: 'bold', size: 24 }
          };
        }
        
        // Special handling for funnel
        if (chartConfig.type === 'funnel' || chartConfig.type === 'funnelInverted' || chartConfig.type === 'pyramid') {
          const funnelData = chartConfig.data.datasets[0].data;
          const maxValue = Math.max(...funnelData);
          const colors = Utils.getColorPalette(funnelData.length);
          
          config.data.datasets[0].backgroundColor = colors;
          config.data.datasets[0].barPercentage = 1;
          config.data.datasets[0].categoryPercentage = 0.9;
        }
        
        const chart = new Chart(ctx, config);
        AppState.chartInstances[chartId] = chart;
        
        return chart;
      },
      
      update: (chartId, newData) => {
        const chart = AppState.chartInstances[chartId];
        if (chart) {

          chart.update();

      destroy: (chartId) => {

        newDataset.innerHTML = `
          <div class="flex items-center gap-3 mb-3">
            <input type="text" value="Série ${count + 1}" 
                   class="flex-1 px-3 py-2 border border-border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary"

      },
      
      addTagToInput: (tag) => {
        const input = document.getElementById('chartTags');
        const currentTags = input.value.split(',').map(t => t.trim()).filter(t => t);
        if (!currentTags.includes(tag)) {
          currentTags.push(tag);
          input.value = currentTags.join(', ');
        }
      },
      
      saveChart: (tabId, chartType, editIndex) => {
        const title = document.getElementById('chartTitle').value.trim();
        const tagsInput = document.getElementById('chartTags').value;
        const tags = tagsInput.split(',').map(t => t.trim()).filter(t => t);
        const labelsText = document.getElementById('chartLabels').value;
        const labels = labelsText.split('\n').map(l => l.trim()).filter(l => l);
        
        // Collect datasets
        const datasetItems = document.querySelectorAll('.dataset-item');
        const datasets = Array.from(datasetItems).map((item, idx) => {
          const labelInput = item.querySelector('input');
          const dataTextarea = item.querySelector('textarea');
          return {
            label: labelInput.value || `Série ${idx + 1}`,
            data: dataTextarea.value.split('\n').map(v => parseFloat(v.trim()) || 0)
          };
        });
        
        // Special handling for gauge
        let chartData = { labels, datasets };
        if (chartType === 'gauge') {
          const gaugeValue = parseFloat(document.getElementById('gaugeValue')?.value) || 50;
          chartData = { value: gaugeValue, max: 100, label: title };
        }
        
        const chart = {
          type: chartType,
          title: title || 'Sem título',
          data: chartData,
          tags: tags,
          createdAt: new Date().toISOString()
        };
        
        // Save tags for reuse
        tags.forEach(tag => {
          if (!AppState.savedTags.includes(tag)) {
            AppState.savedTags.push(tag);
          }
        });
        
        // Initialize scenario charts if needed
        if (!AppState.scenarios[AppState.currentScenario]) {
          AppState.scenarios[AppState.currentScenario] = { name: 'Cenário', charts: {} };
        }
        if (!AppState.scenarios[AppState.currentScenario].charts[tabId]) {
          AppState.scenarios[AppState.currentScenario].charts[tabId] = [];
        }
        
        if (editIndex !== null && editIndex >= 0) {
          AppState.scenarios[AppState.currentScenario].charts[tabId][editIndex] = chart;
        } else {
          AppState.scenarios[AppState.currentScenario].charts[tabId].push(chart);
        }
        
        App.saveToStorage();
        App.closeModal();
        App.renderTabContent();
        Utils.showToast(editIndex !== null ? 'Gráfico atualizado!' : 'Gráfico criado!');
      },
      
      editChart: (tabId, index) => {
        const chart = AppState.scenarios[AppState.currentScenario]?.charts?.[tabId]?.[index];
        if (chart) {
          App.showChartEditor(tabId, chart.type, chart, index);
        }
      },
      
      cloneChart: (tabId, index) => {
        const chart = AppState.scenarios[AppState.currentScenario]?.charts?.[tabId]?.[index];
        if (chart) {
          const clone = Utils.deepClone(chart);
          clone.title = (clone.title || 'Gráfico') + ' (Cópia)';
          clone.createdAt = new Date().toISOString();
          AppState.scenarios[AppState.currentScenario].charts[tabId].push(clone);

      deleteChart: (tabId, index) => {
        const chartId = `chart_${tabId}_${index}`;
        const container = document.querySelector(`[data-chart-id="${chartId}"]`);
        if (container) {
          const deleteBtn = container.querySelector('[title="Eliminar"]');
          if (deleteBtn && deleteBtn.dataset.confirming === 'true') {
            ChartRenderer.destroy(chartId);
            AppState.scenarios[AppState.currentScenario].charts[tabId].splice(index, 1);
            App.saveToStorage();
            App.renderTabContent();
            Utils.showToast('Gráfico eliminado!');
          } else if (deleteBtn) {
            deleteBtn.dataset.confirming = 'true';
            const originalHTML = deleteBtn.innerHTML;
            deleteBtn.innerHTML = '<span class="text-xs font-semibold">OK?</span>';
            deleteBtn.classList.add('ring-2', 'ring-danger');
            
            const resetTimer = setTimeout(() => {
              if (deleteBtn.dataset.confirming === 'true') {
                deleteBtn.dataset.confirming = '';
                deleteBtn.innerHTML = originalHTML;
                deleteBtn.classList.remove('ring-2', 'ring-danger');
              }
            }, 3000);
            
            const tempOnClick = deleteBtn.onclick;
            deleteBtn.onclick = (e) => {
              e.stopPropagation();
              clearTimeout(resetTimer);
              App.deleteChart(tabId, index);
            };
            
            setTimeout(() => {
              deleteBtn.onclick = tempOnClick;
              deleteBtn.dataset.confirming = '';
              deleteBtn.innerHTML = originalHTML;
              deleteBtn.classList.remove('ring-2', 'ring-danger');
            }, 3000);
          }
        }
      },

      handleFileImport: (event) => {
        const file = event.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = JSON.parse(e.target.result);
            
            // Validate data structure
            if (!data.scenarios || typeof data.scenarios !== 'object') {
              Utils.showToast('Formato de ficheiro inválido: faltam cenários', 'error');
              return;
            }
            
            // Merge scenarios with existing ones
            Object.entries(data.scenarios).forEach(([id, scenario]) => {
              if (!AppState.scenarios[id]) {
                AppState.scenarios[id] = scenario;
              } else {
                // Merge charts from imported scenario
                if (scenario.charts) {
                  AppState.scenarios[id].charts = {
                    ...AppState.scenarios[id].charts,
                    ...scenario.charts
                  };
                }
              }
            });
            
            // Merge templates
            if (data.templates && Array.isArray(data.templates)) {
              AppState.templates = [...AppState.templates, ...data.templates];
            }
            
            // Merge tags
            if (data.savedTags && Array.isArray(data.savedTags)) {
              AppState.savedTags = [...new Set([...AppState.savedTags, ...data.savedTags])];
            }
            
            // Merge currencies
            if (data.currencies && typeof data.currencies === 'object') {
              AppState.currencies = { ...AppState.currencies, ...data.currencies };
            }
            
            App.saveToStorage();
            App.renderTabContent();
            Utils.showToast('Dados importados com sucesso!');
            
            console.log('Dados importados:', {
              scenarios: Object.keys(AppState.scenarios).length,
              templates: AppState.templates.length,
              tags: AppState.savedTags.length,
              currencies: Object.keys(AppState.currencies).length
            });
          } catch (err) {
            Utils.showToast('Erro ao importar ficheiro: ' + err.message, 'error');
            console.error('Import error:', err);
          }
        };
        reader.readAsText(file);
        event.target.value = '';
      },

      exportPDF: async () => {
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        const pageWidth = pdf.internal.pageSize.getWidth();
        const pageHeight = pdf.internal.pageSize.getHeight();
        const margin = 15;
        let currentY = margin;
        let pageNum = 1;
        
        const addHeader = () => {
          pdf.setFontSize(10);
          pdf.setTextColor(100);
          pdf.text('IS Excel - Gerador de Gráficos', margin, 10);
          pdf.text(new Date().toLocaleDateString('pt-PT'), pageWidth - margin - 20, 10);
        };
        
        const addFooter = () => {
          pdf.setFontSize(8);
          pdf.setTextColor(150);
          pdf.text(`Página ${pageNum}`, pageWidth / 2, pageHeight - 5, { align: 'center' });
        };
        
        const newPage = () => {
          addFooter();
          pdf.addPage();
          pageNum++;
          currentY = margin + 10;
          addHeader();
        };
        
        addHeader();
        currentY = 20;
        
        // Title
        pdf.setFontSize(18);
        pdf.setTextColor(30, 136, 229);
        pdf.text('Relatório de Gráficos', pageWidth / 2, currentY, { align: 'center' });
        currentY += 15;
        
        // Scenario info
        pdf.setFontSize(12);
        pdf.setTextColor(0);
        const scenario = AppState.scenarios[AppState.currentScenario];
        pdf.text(`Cenário: ${scenario?.name || 'Principal'}`, margin, currentY);
        currentY += 10;
        
        // Add charts
        for (const [tabId, charts] of Object.entries(scenario?.charts || {})) {
          if (!charts || charts.length === 0) continue;
          
          const tab = TabDefinitions.find(t => t.id === tabId);
          if (!tab) continue;
          
          if (currentY > pageHeight - 60) newPage();
          
          pdf.setFontSize(14);
          pdf.setTextColor(30, 136, 229);
          pdf.text(`${tab.name}`, margin, currentY);
          currentY += 8;
          
          for (const chart of charts) {
            if (currentY > pageHeight - 80) newPage();
            
            const chartId = `chart_${tabId}_${charts.indexOf(chart)}`;
            const chartInstance = AppState.chartInstances[chartId];
            
            if (chartInstance) {
              const imgData = chartInstance.toBase64Image('image/png', 1);
              const imgWidth = 80;
              const imgHeight = 60;
              
              pdf.setFontSize(10);
              pdf.setTextColor(0);
              pdf.text(chart.title || 'Sem título', margin, currentY);
              currentY += 5;
              
              pdf.addImage(imgData, 'PNG', margin, currentY, imgWidth, imgHeight);
              currentY += imgHeight + 10;
            }
          }
        }
        
        addFooter();
        pdf.save(`isexcel_relatorio_${Date.now()}.pdf`);
        Utils.showToast('PDF exportado!');
