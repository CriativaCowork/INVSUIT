
<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ladjum/GOV</title>
    <style>
        /* Paleta baseada no logo Ladjum/GOV: Laranja + Castanho Café */
        :root {
            --orange: #F7941D;
            --orange-strong: #EA580C;
            --orange-deep: #C2410C;
            --coffee: #3B2314;
            --coffee-soft: #6B4A2F;
            --cream: #FFF8EC;
            --border: #EADFCB;
            --text: #2E1A0F;
            --text-light: #8A6B54;
            --error: #DC2626;
            --warning: #D97706;
            --success: #16A34A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(180deg, #FDC233 0%, #F7941D 45%, #E96D0C 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            color: var(--text);
        }

        .login-container {
            width: 100%;
            max-width: 440px;
        }

        .login-card {
            background: #ffffff;
            padding: 42px 36px;
            border-radius: 20px;
            box-shadow: 0 20px 45px rgba(59, 35, 20, 0.28);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 68px;
            height: 68px;
            margin: 0 auto 14px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FBB03B, #EA580C);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 18px rgba(234, 88, 12, 0.35);
        }

        .logo-icon svg {
            width: 32px;
            height: 32px;
            fill: #ffffff;
        }

        .logo h1 {
            font-size: 34px;
            font-weight: 800;
            color: var(--coffee);
            letter-spacing: -0.5px;
        }

        .logo h1 span {
            color: var(--orange);
        }

        .logo .swoosh {
            display: block;
            margin: 4px auto 10px;
            width: 160px;
        }

        .logo p {
            color: var(--coffee-soft);
            font-size: 14.5px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--coffee);
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.2s ease;
            background-color: var(--cream);
            color: var(--text);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--orange);
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(247, 148, 29, 0.18);
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #F7941D, #EA580C);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
            box-shadow: 0 6px 14px rgba(234, 88, 12, 0.35);
        }

        .btn:hover {
            background: linear-gradient(135deg, #EA580C, #C2410C);
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(194, 65, 12, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* ===== Botão de Acesso Grátis ===== */
        .divider {
            display: flex;
            align-items: center;
            margin: 26px 0 18px;
            color: var(--text-light);
            font-size: 13px;
            font-weight: 600;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider span {
            padding: 0 12px;
        }

        .btn-free {
            width: 100%;
            padding: 13px;
            background: transparent;
            color: var(--coffee);
            border: 2px solid var(--coffee);
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-free:hover {
            background: var(--coffee);
            color: #ffffff;
        }

        .btn-free svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .free-hint {
            text-align: center;
            margin-top: 10px;
            font-size: 12.5px;
            color: var(--text-light);
            font-weight: 600;
        }

        .footer {
            text-align: center;
            margin-top: 36px;
            max-width: 640px;
            padding: 0 10px;
        }

        .footer p {
            font-size: 12.5px;
            line-height: 1.65;
            color: #FFF6E6;
            text-shadow: 0 1px 2px rgba(59, 35, 20, 0.4);
        }

        .footer strong {
            display: block;
            margin-top: 8px;
            font-size: 13px;
            color: #ffffff;
            letter-spacing: 0.6px;
            text-shadow: 0 1px 2px rgba(59, 35, 20, 0.4);
        }

        /* Sistema de Notificação Toast */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            transform: translateX(150%);
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
            max-width: 380px;
        }

        .toast.show { transform: translateX(0); }
        .toast.error { background-color: var(--error); }
        .toast.warning { background-color: var(--warning); }
        .toast.success { background-color: var(--success); }
        .toast.coffee { background-color: var(--coffee); } /* Alerta de horário (fundo café, letras brancas) */

        /* Animação de Erro (Shake) */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        /* Responsividade Mobile */
        @media (max-width: 480px) {
            body {
                padding: 0;
                justify-content: flex-start;
                padding-top: 10vh;
            }
            .login-card {
                border-radius: 0;
                border-left: none;
                border-right: none;
                padding: 32px 24px;
            }
            .toast {
                top: auto;
                bottom: 20px;
                right: 20px;
                left: 20px;
                max-width: none;
                transform: translateY(150%);
            }
            .toast.show { transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-card" id="loginCard">
            <div class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L4 5.5V11c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5.5L12 2z"/>
                    </svg>
                </div>
                <h1>Ladjum<span>/GOV</span></h1>
                <svg class="swoosh" viewBox="0 0 220 26" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M8 17 C 70 5, 150 4, 202 13" stroke="#3B2314" stroke-width="7" stroke-linecap="round" fill="none"/>
                    <path d="M190 5 L 207 13 L 189 21" stroke="#3B2314" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                </svg>
                <p>Plataforma de Preparação para Concursos Públicos</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Nome ou Telefone</label>
                    <input type="text" id="username" placeholder="Ex: João Silva ou 923000000" required>
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="Introduza a sua senha" required>
                </div>

                <button type="submit" class="btn">Entrar na Plataforma</button>
            </form>

            <!-- Regra excecional: Acesso Grátis por horário -->
            <div class="divider"><span>ou</span></div>
            <button type="button" id="freeAccessBtn" class="btn-free" title="Sem conta e sem senha — apenas dentro do horário definido">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/>
                </svg>
                Acesso Grátis
            </button>
            <p class="free-hint" id="freeHint"></p>
        </div>
    </div>

    <footer class="footer">
        <p>Este software não é um produto/serviço do governo de Angola, é uma iniciativa privada.</p>
        <strong>Ladjum/GOV Copyright 2026</strong>
    </footer>

    <div id="toast" class="toast"></div>

    <script>
        // Base de dados local dos usuários (Mock para testes de layout)
        const users = [
            {
                nome: "Carlos Mendes",
                senha: "carlos2026",
                dataInicio: "2026-01-01",
                dataFim: "2026-12-31" // Acesso Válido
            },
            {
                nome: "924691268",
                senha: "Lusengomono",
                dataInicio: "2026-01-01",
                dataFim: "2029-12-31" // Acesso Válido
            },
            
            {
                nome: "923456789", // Formato Telefone
                senha: "teste123",
                dataInicio: "2026-08-01",
                dataFim: "2026-08-15" // Acesso Válido (Teste de telefone)
            },
            {
                nome: "Ana Sofia",
                senha: "ana123",
                dataInicio: "2025-01-01",
                dataFim: "2025-12-31" // Prazo Expirado (Para testar feedback de aviso)
            }
        ];

        const MENU_URL = "https://criativacowork.github.io/LGOV130072026/assets/1111.html";

        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginCard = document.getElementById('loginCard');
        const toast = document.getElementById('toast');

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const inputUser = usernameInput.value.trim();
            const inputPass = passwordInput.value;

            // 1. Procurar usuário na base local
            const user = users.find(u => u.nome.toLowerCase() === inputUser.toLowerCase() || u.nome === inputUser);

            if (!user) {
                showToast("Usuário não encontrado. Verifique o nome ou telefone.", "error");
                shakeCard();
                return;
            }

            // 2. Validar Senha
            if (user.senha !== inputPass) {
                showToast("Senha incorreta. Por favor, tente novamente.", "error");
                shakeCard();
                return;
            }

            // 3. Validar Prazo de Acesso (Datas)
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            const startDate = new Date(user.dataInicio);
            const endDate = new Date(user.dataFim);
            endDate.setHours(23, 59, 59, 999);

            if (today < startDate) {
                showToast("O seu acesso ainda não está ativo. Aguarde a data de início.", "warning");
                return;
            }

            if (today > endDate) {
                showToast("O seu prazo de acesso expirou. Por favor, contacte o suporte.", "warning");
                return;
            }

            // 4. Sucesso: Redirecionar ao Menu
            showToast("Login bem-sucedido! Redirecionando ao Menu...", "success");
            
            setTimeout(() => {
                window.location.href = MENU_URL;
            }, 1500);
        });

        // =====================================================
        // REGRA EXCECIONAL: ACESSO GRÁTIS POR HORÁRIO
        // Defina aqui a hora de início e a hora de fim (HH:MM)
        // =====================================================
        const acessoGratis = {
            horaInicio: "14:00",
            horaFim: "18:00"
        };

        const freeAccessBtn = document.getElementById('freeAccessBtn');
        const freeHint = document.getElementById('freeHint');

        // Mostra dinamicamente o horário configurado
        freeHint.textContent = `Disponível das ${acessoGratis.horaInicio} às ${acessoGratis.horaFim}`;

        function paraMinutos(hhmm) {
            const [h, m] = hhmm.split(':').map(Number);
            return h * 60 + m;
        }

        function minutosAgora() {
            const agora = new Date();
            return agora.getHours() * 60 + agora.getMinutes();
        }

        function dentroDoHorarioGratis() {
            const agoraM = minutosAgora();
            const ini = paraMinutos(acessoGratis.horaInicio);
            const fim = paraMinutos(acessoGratis.horaFim);

            if (ini <= fim) {
                return agoraM >= ini && agoraM < fim;          // Horário dentro do mesmo dia
            }
            return agoraM >= ini || agoraM < fim;             // Horário que atravessa a meia-noite
        }

        freeAccessBtn.addEventListener('click', function () {
            if (dentroDoHorarioGratis()) {
                // Dentro do horário: entra direto, sem conta nem senha
                showToast("Acesso grátis ativado! Redirecionando ao Menu...", "success");
                setTimeout(() => {
                    window.location.href = MENU_URL;
                }, 1500);
            } else {
                // Fora do horário: alerta fundo café com letras brancas
                const msg = minutosAgora() < paraMinutos(acessoGratis.horaInicio)
                    ? `O horário do acesso grátis ainda não foi atingido. Disponível das ${acessoGratis.horaInicio} às ${acessoGratis.horaFim}.`
                    : `O horário do acesso grátis já terminou por hoje. Disponível das ${acessoGratis.horaInicio} às ${acessoGratis.horaFim}.`;
                showToast(msg, "coffee");
            }
        });

        // ===== Funções auxiliares =====
        function showToast(message, type) {
            toast.textContent = message;
            toast.className = `toast ${type} show`;

            setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        function shakeCard() {
            loginCard.classList.add('shake');
            setTimeout(() => {
                loginCard.classList.remove('shake');
            }, 400);
        }
    </script>
</body>
</html>
